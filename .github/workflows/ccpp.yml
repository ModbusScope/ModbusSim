name: Build

# Triggered when code is pushed to any branch in a repository
on: push

jobs:
  linux:
    runs-on: ubuntu-latest

    container:
      image: docker://jgeudens/qt-linux:6.8.3_build_1
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Configure safe directory for git
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      
      - name: Update Modules and Build
        run: bash scripts/build_linux.sh

      - name: Deploy
        run: bash scripts/deploy_linux.sh

      - uses: actions/upload-artifact@v7.0.0
        with:
          name: modbussim-linux
          path: ModbusSim*.AppImage

      - name: Cache Linux artifact
        uses: actions/cache/save@v6
        with:
          path: ModbusSim*.AppImage
          key: linux-artifact-${{ github.run_id }}

  windows:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Qt installer
        run: pip3 install aqtinstall==3.3.0

      # Cache go build cache, used to speedup go test
      - name: Qt Build Cache
        uses: actions/cache@v6.1.0
        id: cache
        with:
          path: ${{ github.workspace }}\Qt
          key: ${{ runner.os }}-qt-build-${{ hashFiles('scripts\setup_windows.bat') }}

      - name: Setup, build and deploy
        shell: cmd
        run: scripts\full_build_and_deploy_windows.bat '${{ steps.cache.outputs.cache-hit }}' ${{ github.workspace }}\Qt

      - uses: actions/upload-artifact@v7.0.0
        with:
          name: modbussim-windows
          path: |
            ModbusSim.zip

      - name: Cache Windows artifact
        uses: actions/cache/save@v6
        with:
          path: ModbusSim.zip
          key: windows-artifact-${{ github.run_id }}
          enableCrossOsArchive: true

  package:
    runs-on: ubuntu-latest
    needs: [linux, windows]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Wait for caches to propagate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait_for_key() {
            local key="$1"
            echo "Waiting for cache key: $key"
            for i in $(seq 1 12); do
              if gh cache list --repo ${{ github.repository }} --key "$key" | grep -q "$key"; then
                echo "  $key available"; return 0
              fi
              echo "  not yet (attempt $i/12), retrying in 10s..."
              sleep 10
            done
            echo "  timed out after 2 minutes waiting for $key"; return 1
          }
          wait_for_key "linux-artifact-${{ github.run_id }}" & P1=$!
          wait_for_key "windows-artifact-${{ github.run_id }}" & P2=$!
          wait $P1 && wait $P2

      - name: Restore Linux artifact
        uses: actions/cache/restore@v6
        with:
          path: ModbusSim*.AppImage
          key: linux-artifact-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore Windows artifact
        uses: actions/cache/restore@v6
        with:
          path: ModbusSim.zip
          key: windows-artifact-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Move latest-dev tag to current commit
        run: |
          git tag -f latest-dev ${{ github.sha }}
          git push origin latest-dev --force

      - name: Publish dev release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: latest-dev
          name: Latest development build
          prerelease: true
          files: |
            ModbusSim*.AppImage
            ModbusSim.zip
